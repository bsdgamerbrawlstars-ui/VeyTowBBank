name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          rm -rf www && mkdir www && cp "$(ls -S *.html | head -n1)" www/index.html
          test "$(wc -c < www/index.html)" -ge 111992 || { echo "::error::index.html is incomplete: got $(wc -c < www/index.html) bytes, expected about 115456. Re-upload the file with Add file - Upload files"; exit 1; }
          echo '{"name":"app","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init 'VTBank' 'com.app.vtbank' --web-dir www
          npx cap add android
      - run: |
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>|' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
